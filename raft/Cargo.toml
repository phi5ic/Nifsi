[package]
name = "nifsi-raft"
version = "0.1.0"
edition = "2024"

[dependencies]
nifsi-core = { path = "../core" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
async-trait = "0.1.89"

[lib]
path = "src/raft_lib.rs"

