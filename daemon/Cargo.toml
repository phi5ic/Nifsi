[package]
name = "nifsid"
version = "0.1.0"
edition = "2024"

[dependencies]
nifsi-core = { path = "../core" }
nifsi-raft  = { path = "../raft" }
nifsi-mesh  = { path = "../mesh" }
nifsi-fs    = { path = "../fs" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bincode = "1.3"
libc = "0.2"

[[bin]]
name = "nifsid"
path = "src/nifsid_main.rs"

[[bin]]
name = "nifsi-web"
path = "src/nifsi_web.rs"
