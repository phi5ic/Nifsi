[package]
name = "nifsi-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
nifsi-core = { path = "../core" }
nifsi-raft  = { path = "../raft" }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
chacha20poly1305 = "0.10"
bytes = "1.5"
bincode = "1.3"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"

[lib]
path = "src/mesh_lib.rs"
